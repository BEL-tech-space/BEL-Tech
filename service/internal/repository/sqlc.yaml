version: "2"
sql:
  - engine: "postgresql"
    queries: "query.sql"
    schema: "postgres/migrations"
    gen:
      go:
        package: "postgres"
        out: "postgres"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "geometry"
            go_type: "github.com/twpayne/go-geom.Point"
            null: true